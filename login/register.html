<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <form id="registerForm">
            <h3>Silahkan Daftar</h3>
            
            <div class="input-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="Alamat Email .." required="required">
            </div>

            <div class="input-group">
                <label for="reg-username">Nama Pengguna</label>
                <input type="text" id="reg-username" placeholder="Buat Nama Pengguna .." required="required">
            </div>

            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Buat Password .." required="required">
            </div>
            
            <button type="submit" class="btn-submit">Daftar Sekarang</button>

            <div class="social">
                <div class="go"><a href="index.html">SUDAH PUNYA AKUN?</a></div>
            </div>
        </form>
    </div>

</body>
</html>
